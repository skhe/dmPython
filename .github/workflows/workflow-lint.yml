name: Workflow Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: dpi_bridge/go.sum

      - name: Test Go bridge and patched driver
        run: |
          (cd dpi_bridge && go test ./...)
          (cd dpi_bridge/third_party/chunanyong_dm && go test ./...)

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml build twine pytest

      - name: Parse workflow YAML files
        run: |
          python scripts/check_workflow_yaml.py

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.11

      - name: Check version consistency
        run: |
          python scripts/check_version_consistency.py

      - name: Check third-party patch consistency
        run: |
          python scripts/check_third_party_patch.py

      - name: Check roadmap status consistency
        run: |
          python scripts/check_roadmap_status.py

      - name: Check release bundle validation
        run: |
          python -m pytest -q scripts/tests/test_release_assets.py

      - name: Packaging metadata check (sdist)
        run: |
          mkdir -p dpi_include
          printf 'CI packaging sentinel\n' > dpi_include/DPI.h
          python -m build --sdist --outdir /tmp/dist_meta
          python -m twine check /tmp/dist_meta/*
          python scripts/check_sdist_contents.py /tmp/dist_meta/*.tar.gz
