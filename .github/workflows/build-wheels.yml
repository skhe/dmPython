name: Build macOS wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-dm:
    uses: ./.github/workflows/integration-tests.yml

  build:
    needs: real-dm
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    runs-on: macos-14
    name: "arm64 — Python ${{ matrix.python-version }}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: dpi_bridge/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Decode DPI headers
        env:
          DPI_HEADERS_TAR_B64: ${{ secrets.DPI_HEADERS_TAR_B64 }}
        run: |
          test -n "$DPI_HEADERS_TAR_B64"
          mkdir -p dpi_include
          printf '%s' "$DPI_HEADERS_TAR_B64" | base64 -d | tar xzf - -C dpi_include/
          test -f dpi_include/DPI.h

      - name: Build Go bridge library
        run: |
          cd dpi_bridge && go build -buildmode=c-shared -o libdmdpi.dylib .
          install_name_tool -id @rpath/libdmdpi.dylib libdmdpi.dylib

      - name: Install build tools
        run: pip install build delocate

      - name: Build wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          _PYTHON_HOST_PLATFORM: "macosx-14.0-arm64"
        run: DMPYTHON_SKIP_GO_BUILD=1 python -m build --wheel

      - name: Delocate wheel
        run: |
          mkdir -p dist_fixed
          DYLD_LIBRARY_PATH=dpi_bridge delocate-wheel -w dist_fixed dist/*.whl -v

      - name: Verify wheel
        run: |
          python -m venv /tmp/test_venv
          /tmp/test_venv/bin/pip install dist_fixed/*.whl
          /tmp/test_venv/bin/python -c "import dmPython; print('dmPython version:', dmPython.version)"

      - uses: actions/upload-artifact@v4
        if: vars.DMPYTHON_RELEASE_ENABLED == 'true' && github.event_name != 'pull_request'
        with:
          name: wheel-arm64-py${{ matrix.python-version }}
          path: dist_fixed/*.whl

  ci-gate:
    name: CI gate
    needs: [real-dm, build]
    if: always()
    runs-on: ubuntu-latest
    env:
      REAL_DM_RESULT: ${{ needs.real-dm.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Require real database and applicable wheel checks
        run: |
          if [ "$REAL_DM_RESULT" != success ]; then
            echo "::error::Real DM8 regression did not pass: $REAL_DM_RESULT"
            exit 1
          fi
          if [ "$IS_FORK_PR" != true ] && [ "$BUILD_RESULT" != success ]; then
            echo "::error::macOS wheel matrix did not pass: $BUILD_RESULT"
            exit 1
          fi
          if [ "$IS_FORK_PR" = true ]; then
            echo "::notice::macOS wheel matrix awaits a trusted branch with DPI headers."
          fi

  release:
    needs: [build, ci-gate]
    if: startsWith(github.ref, 'refs/tags/v') && vars.DMPYTHON_RELEASE_ENABLED == 'true'
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          path: dist_fixed
          pattern: wheel-*
          merge-multiple: true

      - name: Build source archive and prepare release assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -m pip install build twine
          python -m build --sdist --outdir dist_fixed
          python -m twine check dist_fixed/*.tar.gz
          python scripts/release_assets.py prepare dist_fixed --tag "$TAG_NAME"
          python scripts/release_assets.py verify dist_fixed --tag "$TAG_NAME"

      - name: Upsert GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading artifacts with --clobber"
            gh release upload "$TAG_NAME" dist_fixed/*.whl dist_fixed/*.tar.gz dist_fixed/checksums.txt dist_fixed/build-metadata.json --clobber
          else
            echo "Creating release $TAG_NAME"
            gh release create "$TAG_NAME" --generate-notes dist_fixed/*.whl dist_fixed/*.tar.gz dist_fixed/checksums.txt dist_fixed/build-metadata.json
          fi

      - name: Verify release assets completeness
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" --json assets > /tmp/dmpython-release-assets.json
          python scripts/release_assets.py verify dist_fixed --tag "$TAG_NAME" \
            --assets-json /tmp/dmpython-release-assets.json
