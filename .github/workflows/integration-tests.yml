name: Integration Tests

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  real-dm-arm:
    name: Real DM8 / ARM Linux / Python ${{ matrix.python-version }} / UNICODE ${{ matrix.charset }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        charset: [1, 0]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: dpi_bridge/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pull pinned ARM DM8 development image
        run: |
          docker pull --platform linux/arm64 \
            yhl452493373/dm8@sha256:5b9d23c04b148d5765d6077d95b64032be64daedabeef9cddc7a4216b9ad0a1a

      - name: Start isolated DM8 and extract build headers
        run: |
          admin_password="DmPyA1$(openssl rand -hex 12)"
          test_password="DmPyA1$(openssl rand -hex 12)"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$test_password"
          {
            echo "DM_CI_ADMIN_PASSWORD=$admin_password"
            echo "DM_TEST_PASSWORD=$test_password"
            echo 'DM_TEST_USER=DMPYTEST'
            echo 'DM_TEST_HOST=127.0.0.1'
            echo 'DM_TEST_PORT=15236'
            echo 'DM_BFILE_TEST_CONTAINER=dmpython-ci-dm8'
            echo 'DM_EXPECT_UNICODE=${{ matrix.charset }}'
          } >> "$GITHUB_ENV"
          docker run -d --user root --name dmpython-ci-dm8 \
            -e SYSDBA_PWD="$admin_password" \
            -e SYSAUDITOR_PWD="$admin_password" \
            -e CHARSET=${{ matrix.charset }} -e DB_NAME=DMPYTEST -e INSTANCE_NAME=DMPYTEST \
            -p 127.0.0.1:15236:5236 \
            yhl452493373/dm8@sha256:5b9d23c04b148d5765d6077d95b64032be64daedabeef9cddc7a4216b9ad0a1a
          mkdir -p dpi_include
          docker cp dmpython-ci-dm8:/opt/dmdbms/drivers/dpi/include/. dpi_include/
          test -f dpi_include/DPI.h

      - name: Build driver and create test account
        run: |
          python -m pip install setuptools wheel pytest pytest-timeout
          if ! python setup.py build_ext --inplace > /tmp/dmpython-build.log 2>&1; then
            tail -80 /tmp/dmpython-build.log
            exit 1
          fi
          PYTHONPATH="$PWD" python scripts/prepare_dm_ci.py

      - name: Run real-database regression
        timeout-minutes: 20
        env:
          TZ: Asia/Shanghai
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python -m pytest -q --require-dm tests/integration \
              -m 'p0_stability or p1_contract' --junitxml=pytest-dm.xml
          else
            python -m pytest -q --require-dm -m requires_dm tests \
              --junitxml=pytest-dm.xml
          fi
          python scripts/summarize_junit.py pytest-dm.xml --output trend-dm.json

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-dm-arm-py${{ matrix.python-version }}-unicode${{ matrix.charset }}
          path: |
            pytest-dm.xml
            trend-dm.json
            dm-ci-environment.json
          if-no-files-found: ignore

      - name: Show database logs on failure
        if: failure()
        run: docker logs --tail 80 dmpython-ci-dm8 || true

  real-dm-ssl-arm:
    name: Real DM8 SSL / ARM Linux / Python 3.10
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: dpi_bridge/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Start isolated DM8 and extract build headers
        run: |
          admin_password="DmPyA1$(openssl rand -hex 12)"
          echo "::add-mask::$admin_password"
          {
            echo "DM_CI_ADMIN_PASSWORD=$admin_password"
            echo 'DM_SSL_TEST_PASSWORD='"$admin_password"
            echo 'DM_SSL_TEST_USER=SYSDBA'
            echo 'DM_SSL_TEST_HOST=127.0.0.1'
            echo 'DM_SSL_TEST_PORT=15239'
            echo "DM_SSL_TEST_PATH=$PWD/ssl-certs"
          } >> "$GITHUB_ENV"
          docker pull --platform linux/arm64 \
            yhl452493373/dm8@sha256:5b9d23c04b148d5765d6077d95b64032be64daedabeef9cddc7a4216b9ad0a1a
          docker run -d --user root --workdir /opt/dmdbms/bin --name dmpython-ci-dm8-ssl \
            -e SYSDBA_PWD="$admin_password" \
            -e SYSAUDITOR_PWD="$admin_password" \
            -e CHARSET=1 -e DB_NAME=DMPYSSL -e INSTANCE_NAME=DMPYSSL \
            -p 127.0.0.1:15239:5236 \
            yhl452493373/dm8@sha256:5b9d23c04b148d5765d6077d95b64032be64daedabeef9cddc7a4216b9ad0a1a
          mkdir -p dpi_include ssl-certs
          docker cp dmpython-ci-dm8-ssl:/opt/dmdbms/drivers/dpi/include/. dpi_include/
          docker cp dmpython-ci-dm8-ssl:/opt/dmdbms/bin/client_ssl/SYSDBA/. ssl-certs/
          docker cp dmpython-ci-dm8-ssl:/opt/dmdbms/bin/server_ssl/server-cert.pem ssl-certs/server-cert.pem
          test -f dpi_include/DPI.h
          chmod 700 ssl-certs
          chmod 600 ssl-certs/*

      - name: Build driver and enable mandatory SSL
        run: |
          python -m pip install setuptools wheel pytest pytest-timeout
          if ! python setup.py build_ext --inplace > /tmp/dmpython-ssl-build.log 2>&1; then
            tail -80 /tmp/dmpython-ssl-build.log
            exit 1
          fi
          PYTHONPATH="$PWD" python scripts/enable_dm_ssl_ci.py
          docker restart dmpython-ci-dm8-ssl

      - name: Run encrypted-connection regression
        timeout-minutes: 10
        env:
          TZ: Asia/Shanghai
        run: python -m pytest -q tests/ssl --junitxml=pytest-dm-ssl.xml

      - name: Replace bundled SSL certificate with a SAN certificate
        run: bash scripts/prepare_dm_modern_ssl_ci.sh

      - name: Run modern server certificate regression
        timeout-minutes: 10
        env:
          TZ: Asia/Shanghai
        run: |
          export DM_SSL_MODERN_HOST="$DM_SSL_TEST_HOST"
          export DM_SSL_MODERN_PORT="$DM_SSL_TEST_PORT"
          export DM_SSL_MODERN_USER="$DM_SSL_TEST_USER"
          export DM_SSL_MODERN_PASSWORD="$DM_SSL_TEST_PASSWORD"
          export DM_SSL_MODERN_PATH="$PWD/ssl-modern/client"
          export DM_SSL_MODERN_BAD_CA="$PWD/ssl-certs/ca-cert.pem"
          python -m pytest -q tests/ssl_modern --junitxml=pytest-dm-ssl-modern.xml

      - name: Upload SSL regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-dm-ssl-arm-py3.10
          path: |
            pytest-dm-ssl.xml
            pytest-dm-ssl-modern.xml
          if-no-files-found: ignore

      - name: Show SSL database logs on failure
        if: failure()
        run: docker logs --tail 80 dmpython-ci-dm8-ssl || true

  real-dm-restart-arm:
    name: Real DM8 restart transaction / ARM Linux / Python 3.10
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: dpi_bridge/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Start isolated DM8 and extract build headers
        run: |
          admin_password="DmPyA1$(openssl rand -hex 12)"
          echo "::add-mask::$admin_password"
          {
            echo "DM_RESTART_PASSWORD=$admin_password"
            echo 'DM_RESTART_USER=SYSDBA'
            echo 'DM_RESTART_HOST=127.0.0.1'
            echo 'DM_RESTART_PORT=15240'
            echo 'DM_RESTART_CONTAINER=dmpython-ci-dm8-restart'
          } >> "$GITHUB_ENV"
          docker pull --platform linux/arm64 \
            yhl452493373/dm8@sha256:5b9d23c04b148d5765d6077d95b64032be64daedabeef9cddc7a4216b9ad0a1a
          docker run -d --user root --name dmpython-ci-dm8-restart \
            -e SYSDBA_PWD="$admin_password" -e SYSAUDITOR_PWD="$admin_password" \
            -e CHARSET=1 -e DB_NAME=DMPYRESTART -e INSTANCE_NAME=DMPYRESTART \
            -p 127.0.0.1:15240:5236 \
            yhl452493373/dm8@sha256:5b9d23c04b148d5765d6077d95b64032be64daedabeef9cddc7a4216b9ad0a1a
          mkdir -p dpi_include
          docker cp dmpython-ci-dm8-restart:/opt/dmdbms/drivers/dpi/include/. dpi_include/
          test -f dpi_include/DPI.h

      - name: Verify restart transaction semantics
        timeout-minutes: 10
        run: |
          python -m pip install setuptools wheel
          if ! python setup.py build_ext --inplace > /tmp/dmpython-restart-build.log 2>&1; then
            tail -80 /tmp/dmpython-restart-build.log
            exit 1
          fi
          PYTHONPATH="$PWD" python scripts/verify_dm_restart_transaction.py

      - name: Show restart database logs on failure
        if: failure()
        run: docker logs --tail 80 dmpython-ci-dm8-restart || true
