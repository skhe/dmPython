name: Integration Tests

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  real-dm-arm:
    name: Real DM8 / ARM Linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: dpi_bridge/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Pull pinned ARM DM8 development image
        run: |
          docker pull --platform linux/arm64 \
            yhl452493373/dm8@sha256:5b9d23c04b148d5765d6077d95b64032be64daedabeef9cddc7a4216b9ad0a1a

      - name: Start isolated DM8 and extract build headers
        run: |
          admin_password="DmPyA1$(openssl rand -hex 12)"
          test_password="DmPyA1$(openssl rand -hex 12)"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$test_password"
          {
            echo "DM_CI_ADMIN_PASSWORD=$admin_password"
            echo "DM_TEST_PASSWORD=$test_password"
            echo 'DM_TEST_USER=DMPYTEST'
            echo 'DM_TEST_HOST=127.0.0.1'
            echo 'DM_TEST_PORT=15236'
          } >> "$GITHUB_ENV"
          docker run -d --user root --name dmpython-ci-dm8 \
            -e SYSDBA_PWD="$admin_password" \
            -e SYSAUDITOR_PWD="$admin_password" \
            -e CHARSET=1 -e DB_NAME=DMPYTEST -e INSTANCE_NAME=DMPYTEST \
            -p 127.0.0.1:15236:5236 \
            yhl452493373/dm8@sha256:5b9d23c04b148d5765d6077d95b64032be64daedabeef9cddc7a4216b9ad0a1a
          mkdir -p dpi_include
          docker cp dmpython-ci-dm8:/opt/dmdbms/drivers/dpi/include/. dpi_include/
          test -f dpi_include/DPI.h

      - name: Build driver and create test account
        run: |
          python -m pip install pytest pytest-timeout
          if ! python setup.py build_ext --inplace > /tmp/dmpython-build.log 2>&1; then
            tail -80 /tmp/dmpython-build.log
            exit 1
          fi
          PYTHONPATH="$PWD" python scripts/prepare_dm_ci.py

      - name: Run real-database regression
        timeout-minutes: 20
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python -m pytest -q --require-dm tests/integration \
              -m 'p0_stability or p1_contract' --junitxml=pytest-dm.xml
          else
            python -m pytest -q --require-dm -m requires_dm tests \
              --junitxml=pytest-dm.xml
          fi
          python scripts/summarize_junit.py pytest-dm.xml --output trend-dm.json

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-dm-arm-regression
          path: |
            pytest-dm.xml
            trend-dm.json
          if-no-files-found: ignore

      - name: Show database logs on failure
        if: failure()
        run: docker logs --tail 80 dmpython-ci-dm8 || true
